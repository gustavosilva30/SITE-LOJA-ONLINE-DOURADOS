# Nixpacks config - Easypanel usa este arquivo quando faz build nativo (ignora Dockerfile).
# Garante que o Playwright Chromium seja instalado em /app para persistir no build multi-stage.

[variables]
# Necessário em runtime para o Playwright encontrar os binários
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright-browsers"

[phases.install]
# "..." = mantém os comandos padrão (npm install) e adiciona o nosso.
# Instala Chromium em /app para persistir na imagem final (evita ~/.cache que se perde no multi-stage).
cmds = ["...", "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers npx playwright install chromium --with-deps"]
