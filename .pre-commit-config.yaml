repos:
  # ── Gitleaks: bloqueia commits com credenciais/segredos hardcoded ──────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detectar segredos hardcoded (gitleaks)
        description: >
          Bloqueia commits que contenham connection strings de banco, API keys,
          tokens ou outros segredos. Padrões cobertos: postgresql://...:...@,
          AWS keys, tokens genéricos, etc.

  # ── Hooks padrão: trailing whitespace, fim de arquivo, YAML válido ─────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
